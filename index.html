<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Adding Over 10 – 3-Step Game</title>
  <style>
    :root {
      --unit: 16px;                 /* 1 unit on the number line */
      --line-height: calc(21 * var(--unit));

      --magenta: #e6007a;
      --blue: #0077ff;
      --purple: #7c2ad3;
      --green: #22c55e;

      --bg: #f4f7fb;
      --text-main: #111827;
      --text-muted: #6b7280;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 1.5rem;
      background: var(--bg);
      display: flex;
      justify-content: center;
      color: var(--text-main);
    }

    .app {
      width: 100%;
      max-width: 980px;
    }

    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.7rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      gap: 0.75rem;
    }

    .counter {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .counter strong {
      font-size: 1rem;
      color: var(--text-main);
    }

    .btn-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .btn {
      border-radius: 999px;
      border: 0;
      padding: 0.4rem 0.9rem;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #ec4899);
      color: white;
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
    }

    .btn-ghost {
      background: white;
      color: var(--text-muted);
      border: 1px solid #e5e7eb;
    }

    .step-section {
      display: none;
      margin-top: 0.5rem;
      padding: 1.2rem 1.4rem 1.6rem;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.12);
    }

    .step-section.active {
      display: block;
    }

    .step-title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.8rem;
    }

    .step-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .step-tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .stage-row {
      display: flex;
      align-items: center;
      gap: 3rem;
    }

    .line-stack {
      position: relative;
      width: 300px;
      height: var(--line-height);
    }

    .step-controls {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      align-items: flex-start;
    }

    /* NUMBER LINE */

    .number-line {
      position: absolute;
      bottom: 0;
      left: 120px;
      height: calc(20 * var(--unit)); /* 0–20 uses 20 vertical units */
      width: 60px;
      border-left: 3px solid #111827;
    }

    .ticks {
      position: absolute;
      inset: 0;
    }

    .tick {
      position: absolute;
      width: 100%;
      height: 0; /* we only care about the horizontal line at this y */
    }

    .tick-mark {
      position: absolute;
      top: 0;
      left: 0;
      width: 10px;
      border-top: 1px solid #111827;
    }

    .tick span {
      position: absolute;
      top: 0;               /* top of the glyph sits right on the line */
      left: 14px;
      line-height: 1;
      font-size: 0.7rem;
      color: var(--text-muted);
      transform: translateY(-100%); /* bring text so its TOP is flush */
    }

    .ten-line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(10 * var(--unit)); /* EXACT same y as the 10-tick line */
      border-top: 3px solid var(--green);
      z-index: 4;
      pointer-events: none;
    }

    /* STACKS & BARS */

    .stack {
      position: absolute;
      bottom: 0;
      width: 60px;
      height: calc(20 * var(--unit)); /* shares the 0–20 grid */
    }

    .stack-left {
      left: calc(120px - 60px);      /* bars snug left of the line */
    }

    .stack-right {
      left: calc(120px + 60px);      /* bars on the right of the line */
    }

    .bar {
      position: absolute;
      left: 0;
      width: 100%;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 1.4rem;
      box-shadow: 0 4px 8px rgba(15, 23, 42, 0.25);
      overflow: hidden;
    }

    .bar.magenta { background: var(--magenta); }
    .bar.blue    { background: var(--blue); }
    .bar.purple  { background: var(--purple); }
    .bar.black   { background: #000000; }
    .bar.composite { background: transparent; }

    .segments {
      position: absolute;
      inset: 0;
    }

    .segment {
      position: absolute;
      left: 0;
      width: 100%;
    }

    .segment.purple { background: var(--purple); }
    .segment.blue   { background: var(--blue); }

    .digit {
      position: relative;
      z-index: 2;
    }

    .equation-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      justify-content: flex-start;
      font-size: 1rem;
      margin-top: 0.3rem;
    }

    .equation-row input {
      width: 3rem;
      padding: 0.1rem 0.3rem;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      font-size: 1rem;
      text-align: center;
      outline: none;
    }

    .equation-row input:disabled {
      background: #e5e7eb;
      cursor: not-allowed;
    }

    /* plain numeric inputs: no arrows */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    .feedback {
      min-height: 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: left;
      margin-top: 0.1rem;
    }
    .feedback.ok  { color: #15803d; }
    .feedback.err { color: #b91c1c; }

    @media (max-width: 720px) {
      body {
        padding: 0.75rem;
      }
      .stage-row {
        flex-direction: column;
        align-items: center;
      }
      .step-controls {
        align-items: center;
      }
      .feedback {
        text-align: center;
      }
    }

    /* CONFETTI */

    #confetti-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 9999;
    }

    .confetto {
      position: absolute;
      top: -10px;
      width: 8px;
      height: 14px;
      border-radius: 2px;
      animation: fall 3s linear infinite;
      opacity: 0;
    }

    @keyframes fall {
      0% {
        transform: translate3d(0, -10px, 0) rotateZ(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translate3d(0, 110vh, 0) rotateZ(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
<div class="app">
  <h1>Adding Over 10</h1>

  <div class="top-bar">
    <div class="counter">
      Problems completed: <strong id="correct-count">0</strong>
    </div>
    <div class="btn-row">
      <button type="button" class="btn btn-primary" id="new-problem-btn">New Problem</button>
      <button type="button" class="btn btn-ghost" id="reset-score-btn">Reset Score</button>
    </div>
  </div>

  <!-- STEP 1 -->
  <section class="step-section active" id="step1">
    <div class="step-title-row">
      <div class="step-title">Step 1 – How many do we borrow to make 10?</div>
      <div class="step-tag">Make 10</div>
    </div>

    <div class="stage-row">
      <div class="line-stack">
        <div class="number-line">
          <div class="ticks"></div>
        </div>

        <!-- Left: original bars, with purple+blue segmentation on the top bar -->
        <div class="stack stack-left">
          <div class="bar magenta" id="s1-bottom-bar">
            <span class="digit" id="s1-bottom-digit">8</span>
          </div>
          <div class="bar composite" id="s1-top-bar">
            <div class="segments">
              <div class="segment purple" id="s1-purple-seg"></div>
              <div class="segment blue"   id="s1-blue-seg"></div>
            </div>
            <span class="digit" id="s1-top-digit">3</span>
          </div>
        </div>

        <div class="ten-line"></div>
      </div>

      <div class="step-controls">
        <div class="equation-row">
          <span id="s1-bottom-label">8</span>
          <span>+</span>
          <input type="number" id="s1-input" min="0">
          <span>= 10</span>
        </div>
        <button type="button" class="btn btn-primary" id="s1-check-btn">Check Step 1</button>
        <div class="feedback" id="s1-feedback"></div>
      </div>
    </div>
  </section>

  <!-- STEP 2 -->
  <section class="step-section" id="step2">
    <div class="step-title-row">
      <div class="step-title">Step 2 – How many are left from the top number?</div>
      <div class="step-tag">Leftover above 10</div>
    </div>

    <div class="stage-row">
      <div class="line-stack">
        <div class="number-line">
          <div class="ticks"></div>
        </div>

        <!-- Left: preserve the original magenta + blue stack exactly -->
        <div class="stack stack-left">
          <div class="bar magenta" id="s2-bottom-bar">
            <span class="digit" id="s2-bottom-digit">8</span>
          </div>
          <div class="bar blue" id="s2-top-bar">
            <span class="digit" id="s2-top-digit">3</span>
          </div>
        </div>

        <!-- Right: show ONLY the purple "amount moved to make 10", top aligned with 10 -->
        <div class="stack stack-right">
          <div class="bar purple" id="s2-purple-right-bar">
            <span class="digit" id="s2-purple-right-digit">2</span>
          </div>
        </div>

        <div class="ten-line"></div>
      </div>

      <div class="step-controls">
        <div class="equation-row">
          <span id="s2-top-label">3</span>
          <span>−</span>
          <span id="s2-move-label">2</span>
          <span>=</span>
          <input type="number" id="s2-input" min="0">
        </div>
        <button type="button" class="btn btn-primary" id="s2-check-btn">Check Step 2</button>
        <div class="feedback" id="s2-feedback"></div>
      </div>
    </div>
  </section>

  <!-- STEP 3 -->
  <section class="step-section" id="step3">
    <div class="step-title-row">
      <div class="step-title">Step 3 – Add 10 and the leftover</div>
      <div class="step-tag">Total sum</div>
    </div>

    <div class="stage-row">
      <div class="line-stack">
        <div class="number-line">
          <div class="ticks"></div>
        </div>

        <!-- Left: again, original magenta + blue stack -->
        <div class="stack stack-left">
          <div class="bar magenta" id="s3-bottom-bar">
            <span class="digit" id="s3-bottom-digit">8</span>
          </div>
          <div class="bar blue" id="s3-top-bar">
            <span class="digit" id="s3-top-digit">3</span>
          </div>
        </div>

        <!-- Right: two black bars showing 10 + leftover -->
        <div class="stack stack-right">
          <div class="bar black" id="s3-ten-bar">
            <span class="digit" id="s3-ten-digit">10</span>
          </div>
          <div class="bar black" id="s3-leftover-black-bar">
            <span class="digit" id="s3-leftover-black-digit">1</span>
          </div>
        </div>

        <div class="ten-line"></div>
      </div>

      <div class="step-controls">
        <div class="equation-row">
          <span>10 +</span>
          <span id="s3-leftover-label">1</span>
          <span>=</span>
          <input type="number" id="s3-input" min="0">
        </div>
        <button type="button" class="btn btn-primary" id="s3-check-btn">Finish Problem</button>
        <div class="feedback" id="s3-feedback"></div>
      </div>
    </div>
  </section>

  <div id="confetti-container"></div>
</div>

<script>
  const UNIT = 16; // must match --unit

  let bottomNum = 8;
  let topNum = 3;
  let needToTen = 2;
  let leftover = 1;
  let total = 11;
  let correctCount = 0;
  let finishedThisProblem = false;

  const correctCountEl = document.getElementById('correct-count');
  const newProblemBtn  = document.getElementById('new-problem-btn');
  const resetScoreBtn  = document.getElementById('reset-score-btn');

  const stepSections = {
    1: document.getElementById('step1'),
    2: document.getElementById('step2'),
    3: document.getElementById('step3')
  };

function setStep(step) {
  // Show only the active step section
  [1, 2, 3].forEach((s) => {
    stepSections[s].classList.toggle('active', s === step);
  });

  // Auto-focus the correct input for this step
  if (step === 1) {
    s1Input.focus();
  } else if (step === 2) {
    s2Input.focus();
  } else if (step === 3) {
    s3Input.focus();
  }
}

  /* ticks 0–20, shared by all 3 panels */
  function buildTicksForAllLines() {
    const tickContainers = document.querySelectorAll('.number-line .ticks');
    tickContainers.forEach(container => {
      container.innerHTML = '';
      for (let i = 0; i <= 20; i++) {
        const tick = document.createElement('div');
        tick.className = 'tick';
        tick.style.bottom = (i * UNIT) + 'px';

        const mark = document.createElement('div');
        mark.className = 'tick-mark';

        const label = document.createElement('span');
        label.textContent = i;

        tick.appendChild(mark);
        tick.appendChild(label);
        container.appendChild(tick);
      }
    });
  }

  /* random problem with sum 11–19 and usable make-10 split */
  function randomProblem() {
    while (true) {
      const a = Math.floor(Math.random() * 8) + 2; // 2–9
      const b = Math.floor(Math.random() * 8) + 2;
      const big   = Math.max(a, b);
      const small = Math.min(a, b);
      const s = big + small;
      if (s < 11 || s > 19) continue;

      const need = 10 - big;
      if (need <= 0 || need >= small) continue;

      const left = small - need;
      if (left <= 0) continue;

      bottomNum = big;
      topNum    = small;
      needToTen = need;
      leftover  = left;
      total     = s;
      break;
    }
  }

  /* STEP 1 */

  const s1BottomBar   = document.getElementById('s1-bottom-bar');
  const s1BottomDigit = document.getElementById('s1-bottom-digit');
  const s1TopBar      = document.getElementById('s1-top-bar');
  const s1TopDigit    = document.getElementById('s1-top-digit');
  const s1PurpleSeg   = document.getElementById('s1-purple-seg');
  const s1BlueSeg     = document.getElementById('s1-blue-seg');
  const s1BottomLabel = document.getElementById('s1-bottom-label');
  const s1Input       = document.getElementById('s1-input');
  const s1CheckBtn    = document.getElementById('s1-check-btn');
  const s1Feedback    = document.getElementById('s1-feedback');

  function renderStep1() {
    s1BottomDigit.textContent = bottomNum;
    s1TopDigit.textContent    = topNum;
    s1BottomLabel.textContent = bottomNum;

    s1BottomBar.style.bottom = '0px';
    s1BottomBar.style.height = (bottomNum * UNIT) + 'px';

    s1TopBar.style.bottom = (bottomNum * UNIT) + 'px';
    s1TopBar.style.height = (topNum * UNIT) + 'px';

    s1PurpleSeg.style.bottom = '0px';
    s1PurpleSeg.style.height = (needToTen * UNIT) + 'px';

    s1BlueSeg.style.bottom = (needToTen * UNIT) + 'px';
    s1BlueSeg.style.height = (leftover * UNIT) + 'px';

    s1Input.value = '';
    s1Input.disabled = false;
    s1CheckBtn.disabled = false;
    s1Feedback.textContent = '';
    s1Feedback.className = 'feedback';
  }

  /* STEP 2 */

  const s2BottomBar    = document.getElementById('s2-bottom-bar');
  const s2BottomDigit  = document.getElementById('s2-bottom-digit');
  const s2TopBar       = document.getElementById('s2-top-bar');
  const s2TopDigit     = document.getElementById('s2-top-digit');
  const s2PurpleRightBar   = document.getElementById('s2-purple-right-bar');
  const s2PurpleRightDigit = document.getElementById('s2-purple-right-digit');
  const s2TopLabel     = document.getElementById('s2-top-label');
  const s2MoveLabel    = document.getElementById('s2-move-label');
  const s2Input        = document.getElementById('s2-input');
  const s2CheckBtn     = document.getElementById('s2-check-btn');
  const s2Feedback     = document.getElementById('s2-feedback');

  function renderStep2() {
    // Left: same original stack
    s2BottomDigit.textContent = bottomNum;
    s2TopDigit.textContent    = topNum;

    s2BottomBar.style.bottom = '0px';
    s2BottomBar.style.height = (bottomNum * UNIT) + 'px';

    s2TopBar.style.bottom = (bottomNum * UNIT) + 'px';
    s2TopBar.style.height = (topNum * UNIT) + 'px';

    // Right: purple "amount moved to 10", top flush with 10
    s2PurpleRightDigit.textContent = needToTen;
    s2PurpleRightBar.style.bottom = ((10 - needToTen) * UNIT) + 'px';
    s2PurpleRightBar.style.height = (needToTen * UNIT) + 'px';

    s2TopLabel.textContent  = topNum;
    s2MoveLabel.textContent = needToTen;

    s2Input.value = '';
    s2Input.disabled = false;
    s2CheckBtn.disabled = false;
    s2Feedback.textContent = '';
    s2Feedback.className = 'feedback';
  }

  /* STEP 3 */

  const s3BottomBar    = document.getElementById('s3-bottom-bar');
  const s3BottomDigit  = document.getElementById('s3-bottom-digit');
  const s3TopBar       = document.getElementById('s3-top-bar');
  const s3TopDigit     = document.getElementById('s3-top-digit');
  const s3TenBar       = document.getElementById('s3-ten-bar');
  const s3TenDigit     = document.getElementById('s3-ten-digit');
  const s3LeftoverBlackBar   = document.getElementById('s3-leftover-black-bar');
  const s3LeftoverBlackDigit = document.getElementById('s3-leftover-black-digit');
  const s3LeftoverLbl  = document.getElementById('s3-leftover-label');
  const s3Input        = document.getElementById('s3-input');
  const s3CheckBtn     = document.getElementById('s3-check-btn');
  const s3Feedback     = document.getElementById('s3-feedback');

  function renderStep3() {
    // Left: same original stack
    s3BottomDigit.textContent = bottomNum;
    s3TopDigit.textContent    = topNum;

    s3BottomBar.style.bottom = '0px';
    s3BottomBar.style.height = (bottomNum * UNIT) + 'px';

    s3TopBar.style.bottom = (bottomNum * UNIT) + 'px';
    s3TopBar.style.height = (topNum * UNIT) + 'px';

    // Right: 10-bar + leftover bar
    s3TenDigit.textContent = '10';
    s3TenBar.style.bottom = '0px';
    s3TenBar.style.height = (10 * UNIT) + 'px';

    s3LeftoverBlackDigit.textContent = leftover;
    s3LeftoverBlackBar.style.bottom = (10 * UNIT) + 'px';
    s3LeftoverBlackBar.style.height = (leftover * UNIT) + 'px';

    s3LeftoverLbl.textContent = leftover;

    s3Input.value = '';
    s3Input.disabled = false;
    s3CheckBtn.disabled = false;
    s3Feedback.textContent = '';
    s3Feedback.className = 'feedback';
  }

  function renderAllSteps() {
    renderStep1();
    renderStep2();
    renderStep3();
    finishedThisProblem = false;
    setStep(1);
  }

  /* CONFETTI */

  function launchConfetti() {
    const container = document.getElementById('confetti-container');
    const colors = ['#ec4899', '#6366f1', '#22c55e', '#facc15', '#0ea5e9', '#a855f7'];
    const count = 90;
    for (let i = 0; i < count; i++) {
      const c = document.createElement('div');
      c.className = 'confetto';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDelay = (Math.random() * 2) + 's';
      c.style.opacity = 0.7 + Math.random() * 0.3;
      container.appendChild(c);
      setTimeout(() => c.remove(), 3200);
    }
  }

    /* STEP HANDLERS */

  s1CheckBtn.addEventListener('click', () => {
    const val = parseInt(s1Input.value, 10);
    if (!Number.isFinite(val)) {
      s1Feedback.textContent = 'Type a number first.';
      s1Feedback.className = 'feedback err';
      return;
    }
    if (val === needToTen) {
      s1Feedback.textContent = `Yes! ${bottomNum} + ${needToTen} = 10.`;
      s1Feedback.className = 'feedback ok';
      s1Input.disabled = true;
      s1CheckBtn.disabled = true;
      setStep(2);
      s2Input.focus();
    } else {
      s1Feedback.textContent = 'Not yet. Count the steps from the magenta bar up to the green line.';
      s1Feedback.className = 'feedback err';
    }
  });

  s2CheckBtn.addEventListener('click', () => {
    const val = parseInt(s2Input.value, 10);
    if (!Number.isFinite(val)) {
      s2Feedback.textContent = 'Type a number first.';
      s2Feedback.className = 'feedback err';
      return;
    }
    if (val === leftover) {
      s2Feedback.textContent = `Correct! ${topNum} − ${needToTen} = ${leftover}.`;
      s2Feedback.className = 'feedback ok';
      s2Input.disabled = true;
      s2CheckBtn.disabled = true;
      setStep(3);
      s3Input.focus();
    } else {
      s2Feedback.textContent = 'Try again. How many are left from the top number?';
      s2Feedback.className = 'feedback err';
    }
  });

  s3CheckBtn.addEventListener('click', () => {
  const val = parseInt(s3Input.value, 10);
  if (!Number.isFinite(val)) {
    s3Feedback.textContent = 'Fill in the answer.';
    s3Feedback.className = 'feedback err';
    return;
  }

  if (val === total) {
    s3Feedback.textContent =
      `Great! 10 + ${leftover} = ${total} and ${bottomNum} + ${topNum} = ${total}.`;
    s3Feedback.className = 'feedback ok';
    s3Input.disabled = true;
    s3CheckBtn.disabled = true;

    if (!finishedThisProblem) {
      finishedThisProblem = true;
      correctCount += 1;
      correctCountEl.textContent = correctCount;
      launchConfetti();

      // 🔹 Auto-generate a new problem after a short pause
      setTimeout(() => {
        startNewProblem();   // this also re-focuses Step 1 input
      }, 1000);
    }
  } else {
    s3Feedback.textContent =
      'Check the number line. Count from 10 up to the top of the black stack.';
    s3Feedback.className = 'feedback err';
  }
});

    /* ENTER / RETURN KEY SHORTCUTS */

  function wireEnterAdvance(inputEl, buttonEl) {
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (!buttonEl.disabled && !inputEl.disabled) {
          buttonEl.click();
        }
      }
    });
  }

  wireEnterAdvance(s1Input, s1CheckBtn);
  wireEnterAdvance(s2Input, s2CheckBtn);
  wireEnterAdvance(s3Input, s3CheckBtn);

 /* TOP BUTTONS + SHARED NEW-PROBLEM FUNCTION */

  function startNewProblem() {
    s1Input.focus();
    randomProblem();
    renderAllSteps();
  }

  newProblemBtn.addEventListener('click', () => {
    startNewProblem();
    s1Input.focus();
  });

  resetScoreBtn.addEventListener('click', () => {
    correctCount = 0;
    correctCountEl.textContent = correctCount;
  });

  /* INIT */

  buildTicksForAllLines();
  randomProblem();
  renderAllSteps();
</script>
</body>
</html>
